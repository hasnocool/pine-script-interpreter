[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pine-interpreter"
version = "0.2.0"
description = "A Python interpreter for TradingView Pine Script"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
backtest = [
    "ccxt>=4.4",
]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
pine-interpreter = "pine_interpreter.cli:main"
pine-backtest = "pine_interpreter.backtest.__main__:main"
pine-backtest-batch = "pine_interpreter.backtest.batch_cli:main"
pine-backtest-report = "pine_interpreter.backtest.report_cli:main"
pine-backtest-research = "pine_interpreter.backtest.research_cli:main"
pine-backtest-index = "pine_interpreter.backtest.index_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
